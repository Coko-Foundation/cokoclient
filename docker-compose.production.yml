services:
  client:
    build:
      context: .
      dockerfile: ./dev/client/Dockerfile-client-production
    entrypoint: ['sh', './env.sh']
    command: ['npx', 'serve', '-p', '8080', '--single', './_build']
    ports:
      - ${CLIENT_PORT:-4000}:8080
    environment:
      - SERVER_URL='http://localhost:3000'
      - WEBSOCKET_SERVER_URL='http://localhost:3001'
      - YJS_WEBSOCKET_SERVER_URL='http://localhost:3002'

  server:
    build:
      context: ./dev/server
      dockerfile: ./Dockerfile-server
    depends_on:
      - db
    command: ['yarn', 'coko-server', 'start-dev']
    ports:
      - ${SERVER_PORT:-3000}:${SERVER_PORT:-3000}
    environment:
      - NODE_ENV=development
      - POSTGRES_HOST=db
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_DB=${POSTGRES_DB:-dev}
      - POSTGRES_USER=${POSTGRES_USER:-user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
      - SECRET=${SECRET:-thesecret}
      - SERVER_PORT=${SERVER_PORT:-3000}
      - SERVER_URL=http://localhost:3000
      - CLIENT_URL=${CLIENT_URL:-http://localhost:4000}
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=password
      - ADMIN_GIVEN_NAMES=Admin
      - ADMIN_SURNAME=Adminov
      - ADMIN_EMAIL=admin@example.com
    volumes:
      - ./dev/server/api:/home/node/app/api
      - ./dev/server/config.ts:/home/node/app/config.ts

  db:
    image: postgres:18
    ports:
      - ${POSTGRES_PORT:-5432}:5432
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-dev}
      - POSTGRES_USER=${POSTGRES_USER:-user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
