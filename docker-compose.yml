services:
  client:
    build:
      context: .
      dockerfile: ./dev/client/Dockerfile-client-development
    command: ['node', './scripts/coko-client-dev.mjs']
    ports:
      - ${CLIENT_PORT:-4000}:${CLIENT_PORT:-4000}
    environment:
      - NODE_ENV=development
      - CLIENT_PORT=${CLIENT_PORT:-4000}
      - CLIENT_PAGE_TITLE=${CLIENT_PAGE_TITLE:-"Coko client playground"}
      - CLIENT_APP_ROOT_PATH=./dev/client/app
      - CLIENT_FAVICON_PATH=../static/favicon.ico
      - SERVER_URL=${SERVER_URL:-http://localhost:3000}
      - WEBSOCKET_SERVER_URL=${WEBSOCKET_SERVER_URL:-http://localhost:3001}
      - YJS_WEBSOCKET_SERVER_URL=${YJS_WEBSOCKET_SERVER_URL:-http://localhost:3002}
      - CLIENT_CUSTOM_VAR=${CLIENT_CUSTOM_VAR}
    volumes:
      - ./dev:/home/node/client/dev
      - ./scripts:/home/node/client/scripts
      - ./vite:/home/node/client/vite
      - ./src:/home/node/client/src
    tty: true

  server:
    build:
      context: ./dev/server
      dockerfile: ./Dockerfile-server
    depends_on:
      - db
    command: ['yarn', 'coko-server', 'start-dev']
    ports:
      - ${SERVER_PORT:-3000}:${SERVER_PORT:-3000}
    environment:
      - NODE_ENV=development
      - POSTGRES_HOST=db
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_DB=${POSTGRES_DB:-dev}
      - POSTGRES_USER=${POSTGRES_USER:-user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
      - SECRET=${SECRET:-thesecret}
      - SERVER_PORT=${SERVER_PORT:-3000}
      - SERVER_URL=http://localhost:3000
      - CLIENT_URL=${CLIENT_URL:-http://localhost:4000}
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=password
      - ADMIN_GIVEN_NAMES=Admin
      - ADMIN_SURNAME=Adminov
      - ADMIN_EMAIL=admin@example.com
    volumes:
      - ./dev/server/api:/home/node/app/api
      - ./dev/server/config.ts:/home/node/app/config.ts
      # - ./dev/server/node_modules/@coko/server:/home/node/app/node_modules/@coko/server
    tty: true

  db:
    image: postgres:18
    ports:
      - ${POSTGRES_PORT:-5432}:5432
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-dev}
      - POSTGRES_USER=${POSTGRES_USER:-user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
